<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChannelGate — Sign in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @font-face {
        font-family: "Poppins"; font-style: normal; font-weight: 400; font-display: swap;
        src: url("/fonts/poppins-400-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins"; font-style: normal; font-weight: 600; font-display: swap;
        src: url("/fonts/poppins-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins"; font-style: normal; font-weight: 700; font-display: swap;
        src: url("/fonts/poppins-700-latin.woff2") format("woff2");
      }
      :root {
        --orange: #fe3a02; --panel: #1e3535; --panel-2: #243f3f;
        --line: rgba(145, 201, 206, .18); --ink: #fff; --muted: #91c9ce; --faint: rgba(145, 201, 206, .6);
        --danger: #e5604d;
        --font: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #122424; color: var(--ink); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 30px 28px; width: min(400px, 90vw); }
      .wm { font-weight: 700; font-size: 18px; letter-spacing: .01em; }
      .wm .o { color: var(--orange); }
      .prod { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 2px 0 20px; }
      p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
      input { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); padding: 10px 12px; border-radius: 8px; font: inherit; }
      input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
      button { width: 100%; margin-top: 12px; background: var(--orange); color: #fff; border: none; padding: 11px; border-radius: 8px; font: 600 14px var(--font); cursor: pointer; }
      button:hover { filter: brightness(1.08); }
      button:disabled { opacity: .5; cursor: wait; }
      label { display: block; margin: 14px 0 6px; color: var(--muted); }
      details { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
      summary { color: var(--muted); cursor: pointer; }
      details p { margin-top: 12px; }
      [hidden] { display: none !important; }
      .status { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
      .setup-note { margin: 14px 0 0; font-size: 12px; }
      .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wm"><span class="o">#makeit</span>future<span class="o">.</span></div>
      <div class="prod">Gateway</div>
      <p id="intro">Sign in to your admin account with a passkey.</p>
      <form id="f">
        <button type="submit" id="sign-in">Sign in with a passkey</button>
      </form>
      <details id="bootstrap" hidden>
        <summary>First-time admin setup</summary>
        <p>Use the existing admin password once to register the first passkey for <strong>admin</strong>. Password sign-in ends after setup.</p>
        <form id="bootstrap-form">
          <label for="pw">Existing admin password</label>
          <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" id="bootstrap-submit">Continue setup</button>
        </form>
      </details>
      <form id="enroll-form" hidden>
        <label for="passkey-name">Passkey name</label>
        <input id="passkey-name" type="text" placeholder="For example, work laptop" autocomplete="off" required maxlength="100" />
        <button type="submit" id="enroll-submit">Create your passkey</button>
        <p class="setup-note">Use your device's screen lock or a security key. Keep a spare passkey once signed in.</p>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="err" id="err" role="alert"></div>
    </div>
    <!-- External on purpose: the page is served under a Content-Security-Policy with no inline script. -->
    <script src="/passkeys.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
