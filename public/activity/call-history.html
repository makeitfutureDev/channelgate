<section class="calls-page" aria-label="Call history">
  <div class="calls-head">
    <h1>Calls</h1>
    <button id="calls-refresh" class="order-button" type="button">Refresh</button>
  </div>
  <p class="calls-copy">Your completed calls · estimated voice cost in USD. Agent tasks dispatched during a call are billed separately. Expand a call for its summary and thread posts.</p>
  <p class="calls-copy">History starts with calls completed after this update.</p>
  <p id="calls-status" role="status" aria-live="polite">Loading calls…</p>
  <div id="call-history"></div>
  <button id="calls-more" class="order-button" type="button" hidden>Load older calls</button>
  <noscript><p>Enable JavaScript to view call history.</p></noscript>
</section>
